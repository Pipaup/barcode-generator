<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码生成器</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;display:flex}
.sidebar{width:380px;min-width:380px;background:#fff;border-right:1px solid #e2e5e9;padding:24px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:100vh}
.sidebar h1{font-size:20px;font-weight:700;color:#1a1a2e;letter-spacing:.5px;margin-bottom:2px}
.sidebar h1 span{color:#5b7fff}
.mode-toggle{display:flex;background:#f0f2f5;border-radius:6px;padding:3px;gap:2px}
.mode-toggle input{display:none}
.mode-toggle label{flex:1;text-align:center;padding:7px 0;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;color:#6b7280;transition:background .15s,color .15s}
.mode-toggle input:checked+label{background:#fff;color:#5b7fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.batch-panel,.single-panel{display:flex;flex-direction:column;gap:14px}
.batch-panel{display:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;color:#6b7280;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:14px;font-family:inherit;background:#fafbfc;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#5b7fff;box-shadow:0 0 0 3px rgba(91,127,255,.12)}
.field textarea{resize:vertical}
.row{display:flex;gap:10px}
.row .field{flex:1}
.dim-group{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dim-group .dim-header{font-size:12px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:.5px;margin-bottom:2px}
.text-options{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.text-options .opt-header{font-size:12px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:.5px}
.batch-note{font-size:11px;color:#9ca3af;line-height:1.5}
.toggle-row{display:flex;align-items:center;gap:8px}
.toggle-row label{font-size:13px;color:#374151;cursor:pointer}
.toggle-row input[type=checkbox]{width:16px;height:16px;accent-color:#5b7fff}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary{background:#5b7fff;color:#fff}
.btn-primary:hover{background:#4a6be0}
.btn-secondary{background:#e5e7eb;color:#374151}
.btn-secondary:hover{background:#d1d5db}
.btn-group{display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;overflow:auto}
.paper{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.05);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.paper-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;width:100%;height:100%}
.paper-inner.batch-grid{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:0;padding:0}
.batch-item{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid #eee}
.batch-item .label-text{font-size:10px;font-weight:600;color:#1a1a2e;text-align:center;word-break:break-all;line-height:1.2;padding:1px 2px;overflow:hidden}
.label-text{font-size:12px;font-weight:600;color:#1a1a2e;text-align:center;word-break:break-all;max-width:100%;line-height:1.3;padding:2px 0}
.barcode-svg{display:block;max-width:100%}
.paper-info{font-size:11px;color:#9ca3af;text-align:center;margin-top:12px}
.error-msg{color:#ef4444;font-size:12px;margin-top:4px;min-height:16px}
.page-nav{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#6b7280}
.page-nav button{background:0 0;border:1px solid #d1d5db;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:13px;color:#374151}
.page-nav button:hover{background:#f0f2f5}
.page-nav button:disabled{opacity:.4;cursor:default}
@media print{body{background:#fff}.sidebar{display:none!important}.main{padding:0;overflow:visible;display:block;min-height:0}.paper{box-shadow:none;margin:0 auto}.btn-group,.page-nav,.paper-info{display:none!important}}
</style>
</head>
<body>

<aside class="sidebar">
<h1>条形码<span>生成器</span></h1>
<div class="mode-toggle"><input type="radio" name="mode" id="modeSingle" value="single" checked><label for="modeSingle">单个</label><input type="radio" name="mode" id="modeBatch" value="batch"><label for="modeBatch">批量</label></div>

<div class="single-panel" id="singlePanel">
<div class="field"><label>条形码类型</label><select id="barcodeType"><option value="CODE128" selected>Code 128（通用）</option><option value="CODE39">Code 39</option><option value="EAN13">EAN-13</option><option value="EAN8">EAN-8</option><option value="UPC">UPC-A</option><option value="UPCE">UPC-E</option><option value="ITF">ITF-14</option><option value="MSI">MSI</option><option value="codabar">Codabar</option><option value="pharmacode">Pharmacode</option></select></div>
<div class="field"><label>条形码内容</label><input type="text" id="barcodeValue" value="9787123456789" placeholder="输入条形码内容…"></div>
</div>

<div class="batch-panel" id="batchPanel">
<div class="field"><label>条形码类型（全部统一）</label><select id="batchType"><option value="CODE128" selected>Code 128（通用）</option><option value="CODE39">Code 39</option><option value="EAN13">EAN-13</option><option value="EAN8">EAN-8</option><option value="UPC">UPC-A</option><option value="UPCE">UPC-E</option><option value="ITF">ITF-14</option><option value="MSI">MSI</option><option value="codabar">Codabar</option><option value="pharmacode">Pharmacode</option></select></div>
<div class="field"><label>条形码内容（每行一个）</label><textarea id="batchValues" rows="8" placeholder="每行一个条形码内容…">JFA0221-GN-L
WEF0351-6PCS
WEF0351-8PCS
JFA0209-RD-L
JFA0210-CFE-L
JFA0210-CFE-M</textarea></div>
<div class="row"><div class="field"><label>每行个数</label><input type="number" id="batchCols" value="2" min="1" max="10" step="1"></div><div class="field"><label>间距 (mm)</label><input type="number" id="batchSpacing" value="4" min="0" max="30" step="0.5"></div></div>
<p class="batch-note" id="batchStats">共 6 条</p>
</div>

<div class="dim-group"><div class="dim-header">条形码尺寸 (mm)</div><div class="row"><div class="field"><label>条宽</label><input type="number" id="barWidth" value="2" min="1" max="10" step="0.1"></div><div class="field"><label>高度</label><input type="number" id="barHeight" value="25" min="5" max="200" step="1"></div></div></div>

<div class="field"><label>纸张大小</label><select id="paperSize"><option value="A4" selected>A4 (210 x 297 mm)</option><option value="A5">A5 (148 x 210 mm)</option><option value="A6">A6 (105 x 148 mm)</option><option value="Letter">Letter (215.9 x 279.4 mm)</option><option value="40x30">40 x 30 mm（小标签）</option><option value="60x40">60 x 40 mm（中标签）</option><option value="80x50">80 x 50 mm（大标签）</option><option value="custom">自定义…</option></select></div>

<div id="customPaperGroup" class="dim-group" style="display:none"><div class="dim-header">自定义纸张 (mm)</div><div class="row"><div class="field"><label>宽</label><input type="number" id="customPaperW" value="100" min="10" max="500" step="1"></div><div class="field"><label>高</label><input type="number" id="customPaperH" value="80" min="10" max="500" step="1"></div></div></div>

<div class="text-options"><div class="opt-header">附加文字</div>
<div class="row"><div class="field"><label>文字内容</label><input type="text" id="labelText" placeholder="可选文字（留空=条形码值）…"></div><div class="field"><label>位置</label><select id="textPosition"><option value="top">上方</option><option value="bottom" selected>下方</option></select></div></div>
<div class="row"><div class="field"><label>字号 (pt)</label><input type="number" id="textSize" value="14" min="6" max="72" step="1"></div><div class="field"><label>颜色</label><input type="color" id="textColor" value="#000000"></div></div>
<p class="batch-note" id="textHint">批量模式下，留空则每条使用其条形码值</p></div>

<div class="toggle-row"><input type="checkbox" id="showValue" checked><label for="showValue">在条形码下方显示数字</label></div>
<div class="toggle-row"><input type="checkbox" id="showBorder"><label for="showBorder">显示裁切边框</label></div>
<p class="error-msg" id="errorMsg"></p>

<div class="btn-group"><button class="btn btn-primary" onclick="exportPDF()">导出 PDF</button><button class="btn btn-secondary" onclick="exportSVG()">导出 SVG</button><button class="btn btn-secondary" onclick="exportPNG()">导出 PNG</button><button class="btn btn-secondary" onclick="printBarcode()">打印</button></div>
</aside>

<main class="main">
<div class="paper" id="paper"><div class="paper-inner" id="paperInner"><div class="label-text" id="topText" style="display:none"></div><svg class="barcode-svg" id="barcode"></svg><div class="label-text" id="bottomText" style="display:none"></div></div></div>
<div class="page-nav" id="pageNav" style="display:none"><button id="prevPage" onclick="prevPage()">&lt; 上一页</button><span id="pageIndicator"></span><button id="nextPage" onclick="nextPage()">下一页 &gt;</button></div>
<div class="paper-info" id="paperInfo"></div>
</main>

<script>
var paperSizes={A4:{w:210,h:297},A5:{w:148,h:210},A6:{w:105,h:148},Letter:{w:215.9,h:279.4},"40x30":{w:40,h:30},"60x40":{w:60,h:40},"80x50":{w:80,h:50}};
var SCALE=2.6;
var $=function(id){return document.getElementById(id)};
var batchPages=[],currentBatchPage=0;

function getPaperDims(){var sel=$("paperSize").value;if(sel==="custom")return{w:+$("customPaperW").value,h:+$("customPaperH").value};return paperSizes[sel]||paperSizes.A4}
function isBatch(){return $("modeBatch").checked}
function getSharedOpts(){var sel=isBatch()?"batchType":"barcodeType";return{type:$(sel).value,barW:+$("barWidth").value||2,barH:+$("barHeight").value||25,showVal:$("showValue").checked,showBorder:$("showBorder").checked}}
function getBatchValues(){return $("batchValues").value.split(/[\n\r]+/).map(function(s){return s.trim()}).filter(function(s){return s.length>0})}
function getTextOpts(){return{txt:$("labelText").value.trim(),pos:$("textPosition").value,size:+$("textSize").value||14,color:$("textColor").value}}
function getTextForValue(v){var t=$("labelText").value.trim();return t||v}

function generateSVG(value,opts){var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("xmlns","http://www.w3.org/2000/svg");try{JsBarcode(svg,value,{format:opts.type,width:opts.barW,height:opts.barH,displayValue:opts.showVal,fontSize:12,textMargin:2,margin:6,background:"#ffffff",lineColor:"#000000",valid:function(v){if(!v)console.warn("Invalid:",value)}})}catch(e){svg.setAttribute("viewBox","0 0 200 20");var t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x","10");t.setAttribute("y","14");t.setAttribute("fill","red");t.setAttribute("font-size","8");t.textContent="Error: "+value;svg.appendChild(t)}return svg}

async function svgToDataURL(svg,scale){var clone=svg.cloneNode(true),vb=clone.viewBox.baseVal,w=vb.width*(scale||4),h=vb.height*(scale||4);clone.setAttribute("width",w);clone.setAttribute("height",h);var source=new XMLSerializer().serializeToString(clone);var blob=new Blob([source],{type:"image/svg+xml;charset=utf-8"});var url=URL.createObjectURL(blob);return new Promise(function(resolve,reject){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=w;c.height=h;var ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);resolve({url:c.toDataURL("image/png"),vw:vb.width,vh:vb.height})};img.onerror=reject;img.src=url})}

function calcBatchLayout(values,dims,barW,barH,cols,spacing){var margin=6,usableW=dims.w-margin*2,usableH=dims.h-margin*2;var avgLen=Math.max(8,values.reduce(function(a,v){return a+v.length},0)/Math.max(1,values.length));var barcodeW_mm=avgLen*barW*1.6+8,barcodeH_mm=barH+4,textH_mm=4;var cellW=(usableW-(cols-1)*spacing)/cols,cellH=barcodeH_mm+textH_mm+spacing;var rowsPerPage=Math.floor((usableH+spacing)/(cellH+spacing));var perPage=cols*rowsPerPage,totalPages=Math.ceil(values.length/perPage);return{cellW:cellW,cellH:cellH,barcodeW_mm:barcodeW_mm,barcodeH_mm:barcodeH_mm,textH_mm:textH_mm,rowsPerPage:rowsPerPage,perPage:perPage,totalPages:totalPages,margin:margin}}

function updatePreview(){var dims=getPaperDims(),paper=$("paper");paper.style.width=(dims.w*SCALE)+"px";paper.style.height=(dims.h*SCALE)+"px";paper.style.outline=$("showBorder").checked?"1px dashed #d1d5db":"none";paper.style.outlineOffset=$("showBorder").checked?"-1px":"0";$("paperInfo").textContent="纸张: "+dims.w.toFixed(1)+" x "+dims.h.toFixed(1)+" mm";if(isBatch())renderBatchPreview();else renderSinglePreview()}

function renderSinglePreview(){var inner=$("paperInner");inner.className="paper-inner";inner.innerHTML='<div class="label-text" id="topText" style="display:none"></div><svg class="barcode-svg" id="barcode"></svg><div class="label-text" id="bottomText" style="display:none"></div>';var value=$("barcodeValue").value.trim(),opts=getSharedOpts(),svgEl=inner.querySelector("#barcode");$("errorMsg").textContent="";if(!value){svgEl.setAttribute("viewBox","0 0 200 30");svgEl.style.width="200px";svgEl.style.height="30px";return}try{JsBarcode(svgEl,value,{format:opts.type,width:opts.barW,height:opts.barH,displayValue:opts.showVal,fontSize:12,textMargin:2,margin:6,background:"#ffffff",lineColor:"#000000",valid:function(v){if(!v)$("errorMsg").textContent="内容不符合所选格式规则"}})}catch(e){$("errorMsg").textContent="生成失败: "+e.message;svgEl.setAttribute("viewBox","0 0 200 30");svgEl.style.width="200px";svgEl.style.height="30px"}var to=getTextOpts(),topEl=inner.querySelector("#topText"),bottomEl=inner.querySelector("#bottomText"),dt=to.txt||value;if(to.txt&&to.pos==="top"){topEl.textContent=dt;topEl.style.display="";topEl.style.fontSize=to.size+"px";topEl.style.color=to.color;bottomEl.style.display="none"}else if(to.txt&&to.pos==="bottom"){bottomEl.textContent=dt;bottomEl.style.display="";bottomEl.style.fontSize=to.size+"px";bottomEl.style.color=to.color;topEl.style.display="none"}else{topEl.style.display="none";bottomEl.style.display="none"}$("pageNav").style.display="none"}

function renderBatchPreview(){var values=getBatchValues(),opts=getSharedOpts(),dims=getPaperDims();var cols=+$("batchCols").value||2,spacing=+$("batchSpacing").value||4;$("batchStats").textContent="共 "+values.length+" 条";if(values.length===0){$("paperInner").innerHTML='<div style="color:#9ca3af;font-size:13px;text-align:center;width:100%">请在左侧输入条形码内容</div>';$("paperInner").className="paper-inner";$("pageNav").style.display="none";return}var layout=calcBatchLayout(values,dims,opts.barW,opts.barH,cols,spacing);batchPages=[];for(var i=0;i<values.length;i+=layout.perPage)batchPages.push(values.slice(i,i+layout.perPage));currentBatchPage=Math.min(currentBatchPage,batchPages.length-1);renderBatchPage(currentBatchPage,values,opts,dims,cols,spacing)}

function renderBatchPage(pageIdx,values,opts,dims,cols,spacing){var layout=calcBatchLayout(values,dims,opts.barW,opts.barH,cols,spacing);var pageValues=batchPages[pageIdx],inner=$("paperInner");inner.className="paper-inner batch-grid";var marginPx=layout.margin*SCALE,cellWPx=layout.cellW*SCALE,cellHPx=layout.cellH*SCALE,spacingPx=spacing*SCALE;inner.style.padding=marginPx+"px";inner.style.gap=spacingPx+"px";inner.innerHTML="";var textOpts=getTextOpts();pageValues.forEach(function(value){var item=document.createElement("div");item.className="batch-item";item.style.width=cellWPx+"px";item.style.height=cellHPx+"px";var svg=generateSVG(value,opts);svg.classList.add("barcode-svg");var vb=svg.viewBox.baseVal,svgAspect=vb?vb.height/vb.width:0.3;var maxW=cellWPx*0.9,maxH=cellHPx*0.7,sw=maxW,sh=sw*svgAspect;if(sh>maxH){sh=maxH;sw=sh/svgAspect}svg.style.width=sw+"px";svg.style.height=sh+"px";var displayText=getTextForValue(value),label=document.createElement("div");label.className="label-text";label.textContent=displayText;label.style.fontSize=Math.min(textOpts.size,11)+"px";label.style.color=textOpts.color;if(textOpts.pos==="top"){item.appendChild(label);item.appendChild(svg)}else{item.appendChild(svg);item.appendChild(label)}inner.appendChild(item)});if(batchPages.length>1){$("pageNav").style.display="flex";$("pageIndicator").textContent="第 "+(pageIdx+1)+"/"+batchPages.length+" 页";$("prevPage").disabled=pageIdx===0;$("nextPage").disabled=pageIdx===batchPages.length-1}else $("pageNav").style.display="none";$("paperInfo").textContent="纸张: "+dims.w.toFixed(1)+" x "+dims.h.toFixed(1)+" mm  |  "+layout.rowsPerPage+" 行 x "+cols+" 列  |  每页 "+layout.perPage+" 条"}

function prevPage(){if(currentBatchPage>0){currentBatchPage--;updatePreview()}}
function nextPage(){if(currentBatchPage<batchPages.length-1){currentBatchPage++;updatePreview()}}

async function exportPDF(){if(isBatch()){await exportBatchPDF();return}var dims=getPaperDims(),opts=getSharedOpts(),value=$("barcodeValue").value.trim();if(!value){alert("请先输入条形码内容");return}var svg=generateSVG(value,opts);var res=await svgToDataURL(svg,24);var dataURL=res.url;var jsPDF=window.jspdf.jsPDF;var pdf=new jsPDF({orientation:dims.w>dims.h?"landscape":"portrait",unit:"mm",format:[dims.w,dims.h]});pdf.setFillColor(255,255,255);pdf.rect(0,0,dims.w,dims.h,"F");var margin=8,usableW=dims.w-margin*2,usableH=dims.h-margin*2;var vb=svg.viewBox.baseVal,ratio=res.vh/res.vw;var bw=Math.min(usableW*0.92,usableW),bh=bw*ratio;if(bh>usableH*0.7){bh=usableH*0.7;bw=bh/ratio}var to=getTextOpts(),textH=to.txt?(to.size*0.35+4):0,totalH=bh+textH+4,y=(dims.h-totalH)/2;if(to.txt&&to.pos==="top"){pdf.setTextColor(to.color);pdf.setFontSize(Math.min(to.size,24));pdf.setFont("helvetica","bold");pdf.text(to.txt,dims.w/2,y+to.size*0.35,{align:"center"});y+=textH}pdf.addImage(dataURL,"PNG",(dims.w-bw)/2,y,bw,bh,undefined,);if(to.txt&&to.pos==="bottom"){y+=bh+2;pdf.setTextColor(to.color);pdf.setFontSize(Math.min(to.size,24));pdf.setFont("helvetica","bold");pdf.text(to.txt,dims.w/2,y+to.size*0.35,{align:"center"})}if($("showBorder").checked){pdf.setDrawColor(200);pdf.setLineDashPattern([2,2],0);pdf.rect(2,2,dims.w-4,dims.h-4)}pdf.save("barcode.pdf")}

async function exportBatchPDF(){var values=getBatchValues();if(values.length===0){alert("请先输入条形码内容");return}var opts=getSharedOpts(),dims=getPaperDims(),cols=+$("batchCols").value||2,spacing=+$("batchSpacing").value||4;var layout=calcBatchLayout(values,dims,opts.barW,opts.barH,cols,spacing);var jsPDF=window.jspdf.jsPDF;var pdf=new jsPDF({orientation:dims.w>dims.h?"landscape":"portrait",unit:"mm",format:[dims.w,dims.h]});var textOpts=getTextOpts(),cellW=layout.cellW,cellH=layout.cellH+spacing,margin=layout.margin;for(var i=0;i<values.length;i++){if(i>0&&i%layout.perPage===0)pdf.addPage([dims.w,dims.h]);var pageIdx=i%layout.perPage,row=Math.floor(pageIdx/cols),col=pageIdx%cols;var x=margin+col*(cellW+spacing),y=margin+row*cellH;var value=values[i],svg=generateSVG(value,opts),res=await svgToDataURL(svg,24),dataURL=res.url;var svgAspect=res.vh/res.vw,fitW=Math.min(barcodeW,barcodeH/svgAspect),fitH=fitW*svgAspect;var displayText=getTextForValue(value),txtSize=Math.min(textOpts.size,10),txtH=txtSize*0.35+1;var innerW=cellW-spacing,barcodeH=cellH-txtH-spacing*1.5,barcodeW=innerW-spacing;if($("showBorder").checked){pdf.setDrawColor(220);pdf.setLineDashPattern([1,1],0);pdf.rect(x,y,cellW,cellH)}if(textOpts.txt.trim()&&textOpts.pos==="top"){pdf.setTextColor(textOpts.color);pdf.setFontSize(txtSize);pdf.setFont("helvetica","bold");pdf.text(displayText,x+cellW/2,y+spacing+txtSize*0.35,{align:"center",maxWidth:innerW-2});pdf.addImage(dataURL,"PNG",x+spacing/2,y+spacing+txtH,fitW,fitH,undefined,)}else{pdf.addImage(dataURL,"PNG",x+spacing/2,y+spacing,fitW,fitH,undefined,);if(textOpts.txt.trim()||opts.showVal){pdf.setTextColor(textOpts.color);pdf.setFontSize(txtSize);pdf.setFont("helvetica","bold");pdf.text(displayText,x+cellW/2,y+barcodeH,{align:"center",maxWidth:innerW-2})}}}pdf.save("barcodes-batch.pdf")}

function exportSVG(){var value=isBatch()?getBatchValues()[0]:$("barcodeValue").value.trim();if(!value){alert("请先输入条形码内容");return}var svg=generateSVG(value,getSharedOpts());var source=new XMLSerializer().serializeToString(svg.cloneNode(true));var blob=new Blob(["<?xml version='1.0' encoding='UTF-8'?>\n"+source],{type:"image/svg+xml;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="barcode.svg";a.click();URL.revokeObjectURL(url)}

function exportPNG(){var svg;if(isBatch()){var v=getBatchValues()[0];if(!v){alert("请先输入条形码内容");return}svg=generateSVG(v,getSharedOpts())}else{svg=$("barcode");if(!svg||!svg.viewBox.baseVal)return}svgToDataURL(svg,6).then(function(r){var a=document.createElement("a");a.href=r.url;a.download="barcode.png";a.click()})}

function printBarcode(){window.print()}

function switchMode(){var batch=isBatch();$("singlePanel").style.display=batch?"none":"";$("batchPanel").style.display=batch?"":"none";$("textHint").style.display=batch?"":"none";currentBatchPage=0;updatePreview()}

$("modeSingle").addEventListener("change",switchMode);
$("modeBatch").addEventListener("change",switchMode);
$("paperSize").addEventListener("change",function(){$("customPaperGroup").style.display=this.value==="custom"?"":"none";updatePreview()});
["barcodeValue","barcodeType","batchType","batchValues","batchCols","batchSpacing","barWidth","barHeight","showValue"].forEach(function(id){$(id).addEventListener("input",updatePreview);$(id).addEventListener("change",updatePreview)});
["labelText","textPosition","textSize","textColor"].forEach(function(id){$(id).addEventListener("input",updatePreview);$(id).addEventListener("change",updatePreview)});
["paperSize"].forEach(function(id){$(id).addEventListener("change",updatePreview)});
["customPaperW","customPaperH","showBorder"].forEach(function(id){$(id).addEventListener("input",updatePreview);$(id).addEventListener("change",updatePreview)});
switchMode();
</script>
</body>
</html>
